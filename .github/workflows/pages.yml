name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Diagnose live AI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.luofeishuang.xyz';
          const headers={Origin:'https://luofeishuang.github.io'};
          for(const [path,method] of [['status','GET'],['probe','POST']]){
            try{
              const response=await fetch(base+'/api/'+path,{method,headers,signal:AbortSignal.timeout(18000)});
              console.log(path,response.status,(await response.text()).slice(0,500));
            }catch(error){console.log(path,error.name,error.cause?.code||'');}
          }
          NODE
